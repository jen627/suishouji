    document.documentElement.setAttribute('data-theme', themeId === 'default' ? '' : themeId);
    this.state.theme = themeId;
    try { localStorage.setItem('suiShouJi_theme', themeId); } catch {}
    // Update color palettes
    const t = this.themes.find(t => t.id === themeId);
    if (t) {
      this.colors = t.colors;
      this.bgColors = t.bgColors;
      // Update draw color to first brush color of the theme
      this.state.drawColor = t.colors[0];
      this.state.patternDrawColor = t.colors[3] || t.colors[0];
      this.state.fullPageDrawColor = t.colors[3] || t.colors[0];
      // Re-render palettes
      this.renderColorPalette();
      this.renderFullPageColors();
      if (document.getElementById('bgColorGrid').children.length > 0) {
        this.renderBgColors();
      }
    }
  },

  showThemeModal() {
    const grid = document.getElementById('themeGrid');
    grid.innerHTML = this.themes.map(t => `
      <div class="theme-card ${t.id === this.state.theme ? 'selected' : ''}" onclick="App.setTheme('${t.id}')">
        <div class="theme-preview">${t.swatches.map(c => `<span class="theme-swatch" style="background:${c}"></span>`).join('')}</div>
        <div class="theme-name">${t.name}</div>
      </div>
    `).join('');
    document.getElementById('themeModal').classList.add('active');
    document.getElementById('themeModal').onclick = (e) => {
      if (e.target === document.getElementById('themeModal')) {
        document.getElementById('themeModal').classList.remove('active');
      }
    };
  },

  setTheme(themeId) {
    this.applyTheme(themeId);
    document.getElementById('themeModal').classList.remove('active');
    this.toast('主题已切换');
  },

  // ========== Image Paste & Lasso Crop ==========
  triggerImagePaste() {
    document.getElementById('imageFileInput').click();
  },

  handleImageFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      this.openImageCrop(e.target.result);
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  },

  openImageCrop(dataUrl) {
    const img = new Image();
    img.onload = () => {
      this.state.cropImage = img;
      this.state.cropLasso = [];
      this.state.cropLoopClosed = false;
      document.getElementById('imageCropModal').classList.add('active');
      document.getElementById('imageCropTip').style.display = '';
      document.getElementById('imageCropChoice').classList.remove('active');
      this.resizeImageCropCanvas();
    };
    img.src = dataUrl;
  },

  resizeImageCropCanvas() {
    const img = this.state.cropImage;
    if (!img) return;
    const body = document.getElementById('imageCropBody');
    const canvas = document.getElementById('imageCropCanvas');
    const maxW = body.clientWidth;
    const maxH = body.clientHeight;
    let w = img.width, h = img.height;
    const scale = Math.min(maxW / w, maxH / h, 1);
    w = Math.floor(w * scale);
    h = Math.floor(h * scale);
    canvas.width = w;
    canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
  },

  initImageCropCanvas() {
    const canvas = document.getElementById('imageCropCanvas');
    const ctx = canvas.getContext('2d');

    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
    };

    const startDraw = (e) => {
      if (!this.state.cropImage || this.state.cropLoopClosed) return;
      e.preventDefault();
      this.state.cropLasso = [];
      const pos = getPos(e);
      this.state.cropLasso.push(pos);
      this.renderCropPreview();
    };

    const draw = (e) => {
      if (!this.state.cropImage || this.state.cropLoopClosed) return;
      e.preventDefault();
      if (this.state.cropLasso.length === 0) return;
      const pos = getPos(e);
      const last = this.state.cropLasso[this.state.cropLasso.length - 1];
      const dist = Math.hypot(pos.x - last.x, pos.y - last.y);
      if (dist < 3) return;
      this.state.cropLasso.push(pos);
      this.renderCropPreview();

      // Check if loop is closed (finger returned near start point)
      if (this.state.cropLasso.length > 20) {
        const first = this.state.cropLasso[0];
        const d = Math.hypot(pos.x - first.x, pos.y - first.y);
        if (d < 25) {
          this.state.cropLoopClosed = true;
          this.renderCropPreview();
          document.getElementById('imageCropTip').style.display = 'none';
          document.getElementById('imageCropChoice').classList.add('active');
        }
      }
    };

    const endDraw = (e) => {
      if (!this.state.cropImage || this.state.cropLoopClosed) return;
      e.preventDefault();
      // If not closed naturally, try to close with nearest point
      if (this.state.cropLasso.length > 10) {
        const first = this.state.cropLasso[0];
        const last = this.state.cropLasso[this.state.cropLasso.length - 1];
        if (Math.hypot(last.x - first.x, last.y - first.y) < 40) {
          this.state.cropLasso.push({ x: first.x, y: first.y });
          this.state.cropLoopClosed = true;
          this.renderCropPreview();
          document.getElementById('imageCropTip').style.display = 'none';
          document.getElementById('imageCropChoice').classList.add('active');
        }
      }
    };

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', endDraw);
  },

  renderCropPreview() {
    const canvas = document.getElementById('imageCropCanvas');
    const ctx = canvas.getContext('2d');
    const img = this.state.cropImage;
    if (!img) return;

    // Redraw image
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    // Draw lasso path
    if (this.state.cropLasso.length < 2) return;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(this.state.cropLasso[0].x, this.state.cropLasso[0].y);
    for (let i = 1; i < this.state.cropLasso.length; i++) {
      ctx.lineTo(this.state.cropLasso[i].x, this.state.cropLasso[i].y);
    }
    if (this.state.cropLoopClosed) {
      ctx.closePath();
    }
    ctx.strokeStyle = '#7C3AED';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 3]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // If closed, draw semi-transparent overlay
    if (this.state.cropLoopClosed) {
      this.drawCropMask(ctx, canvas.width, canvas.height);
    }
  },

  drawCropMask(ctx, w, h) {
    // Create mask: darken outside the lasso path
    const offCanvas = document.createElement('canvas');
    offCanvas.width = w;
    offCanvas.height = h;
    const offCtx = offCanvas.getContext('2d');

    // Draw the lasso path
    offCtx.beginPath();
    offCtx.moveTo(this.state.cropLasso[0].x, this.state.cropLasso[0].y);
    for (let i = 1; i < this.state.cropLasso.length; i++) {
      offCtx.lineTo(this.state.cropLasso[i].x, this.state.cropLasso[i].y);
    }
    offCtx.closePath();
    offCtx.clip();

    // Fill inside with highlight
    offCtx.fillStyle = 'rgba(124,58,237,0.15)';
    offCtx.fill();

    // Draw on main canvas
    ctx.drawImage(offCanvas, 0, 0);
  },

  cropSelect(region) {
    const canvas = document.getElementById('imageCropCanvas');
    const w = canvas.width, h = canvas.height;

    // Create output canvas
    const outCanvas = document.createElement('canvas');
    outCanvas.width = w;
    outCanvas.height = h;
    const outCtx = outCanvas.getContext('2d');

    const buildPath = (ctx) => {
      ctx.beginPath();
      ctx.moveTo(this.state.cropLasso[0].x, this.state.cropLasso[0].y);
      for (let i = 1; i < this.state.cropLasso.length; i++) {
        ctx.lineTo(this.state.cropLasso[i].x, this.state.cropLasso[i].y);
      }
      ctx.closePath();
    };

    if (region === 'inside') {
      buildPath(outCtx);
      outCtx.clip();
      outCtx.drawImage(canvas, 0, 0);
    } else {
      outCtx.drawImage(canvas, 0, 0);
      outCtx.globalCompositeOperation = 'destination-out';
      buildPath(outCtx);
      outCtx.fill();
      outCtx.globalCompositeOperation = 'destination-over';
      outCtx.fillStyle = '#FFFFFF';
      outCtx.fillRect(0, 0, w, h);
    }

    this.state.cropImage = null;
    this.state.cropLasso = [];
    this.state.cropLoopClosed = false;
    document.getElementById('imageCropModal').classList.remove('active');
    document.getElementById('imageCropChoice').classList.remove('active');

    const croppedUrl = outCanvas.toDataURL('image/png');
    const textLayer = document.getElementById('textLayer');
    textLayer.focus();
    const imgId = 'img_' + Date.now();
    const imgHtml = `<div contenteditable="false" class="inserted-image-wrapper" data-img-id="${imgId}" data-rotate="0" style="width:260px;"><img src="${croppedUrl}" style="transform:rotate(0deg);"><div class="img-ctrls"><button class="img-ctrl-btn" data-action="rotl" title="左转">↺</button><button class="img-ctrl-btn" data-action="rotr" title="右转">↻</button><button class="img-ctrl-btn" data-action="shrink" title="缩小">−</button><button class="img-ctrl-btn" data-action="grow" title="放大">+</button></div></div><br>`;
    // Insert at cursor
    document.execCommand('insertHTML', false, imgHtml);
    this.toast('图片已贴入');
  },

  cancelImageCrop() {
    this.state.cropImage = null;
    this.state.cropLasso = [];
    this.state.cropLoopClosed = false;
    document.getElementById('imageCropModal').classList.remove('active');
    document.getElementById('imageCropChoice').classList.remove('active');
  },

  // ========== Voice Recording ==========
  toggleVoiceRecord() {
    if (this.state.mediaRecorder && this.state.mediaRecorder.state === 'recording') {
      this.stopVoiceRecord();
      return;
    }
    if (this.state.voiceDataUrl) {
      // Already have a recording, start playback
      this.toggleVoicePlayback();
      return;
    }
    this.startVoiceRecord();
  },

  async startVoiceRecord() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      this.state.mediaRecorder = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm' });
      this.state.voiceChunks = [];
      this.state.voiceDataUrl = null;

      this.state.mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) this.state.voiceChunks.push(e.data);
      };

      this.state.mediaRecorder.onstop = () => {
        const blob = new Blob(this.state.voiceChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = (e) => {
          this.state.voiceDataUrl = e.target.result;
          this.showVoicePlayer();
        };
        reader.readAsDataURL(blob);
        // Stop all tracks
        stream.getTracks().forEach(t => t.stop());
      };

      this.state.mediaRecorder.start();
      this.showRecIndicator();
      this.state.recStartTime = Date.now();
      this.state.recTimer = setInterval(() => {
        const elapsed = Math.floor((Date.now() - this.state.recStartTime) / 1000);
        const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        document.getElementById('recTime').textContent = `${m}:${s}`;
      }, 200);

      const voiceBtn = document.getElementById('toolVoice');
      if (voiceBtn) { voiceBtn.textContent = '🔴'; voiceBtn.style.background = '#FEE2E2'; }
    } catch (err) {
      this.toast('无法访问麦克风');
      console.error(err);
    }
  },

  stopVoiceRecord() {
    if (this.state.mediaRecorder && this.state.mediaRecorder.state === 'recording') {
      this.state.mediaRecorder.stop();
    }
    if (this.state.recTimer) {
      clearInterval(this.state.recTimer);
      this.state.recTimer = null;
    }
    document.getElementById('voiceRecIndicator').classList.remove('active');
    const voiceBtn = document.getElementById('toolVoice');
    if (voiceBtn) { voiceBtn.textContent = '🎤'; voiceBtn.style.background = ''; }
  },

  showRecIndicator() {
    document.getElementById('voiceArea').classList.add('active');
    document.getElementById('voiceRecIndicator').classList.add('active');
    document.getElementById('voicePlayer').style.display = 'none';
    document.getElementById('recTime').textContent = '00:00';
  },

  showVoicePlayer() {
    document.getElementById('voiceArea').classList.add('active');
    document.getElementById('voiceRecIndicator').classList.remove('active');
    document.getElementById('voicePlayer').style.display = 'flex';
    document.getElementById('voiceTime').textContent = document.getElementById('recTime').textContent;
    document.getElementById('voiceProgressFill').style.width = '0%';
  },

  toggleVoicePlayback() {
    if (this.state.voicePlaying) {
      this.pauseVoice();
      return;
    }
    if (!this.state.voiceDataUrl) return;

    if (this.state.voiceAudio) {
      this.state.voiceAudio.pause();
      this.state.voiceAudio = null;
    }

    const audio = new Audio(this.state.voiceDataUrl);
    this.state.voiceAudio = audio;
    this.state.voicePlaying = true;
    document.getElementById('voicePlayBtn').textContent = '⏸️';

    audio.ontimeupdate = () => {
      const pct = (audio.currentTime / audio.duration) * 100;
      document.getElementById('voiceProgressFill').style.width = pct + '%';
      const m = String(Math.floor(audio.currentTime / 60)).padStart(2, '0');
      const s = String(Math.floor(audio.currentTime % 60)).padStart(2, '0');
      document.getElementById('voiceTime').textContent = `${m}:${s}`;
    };

    audio.onended = () => {
      this.state.voicePlaying = false;
      document.getElementById('voicePlayBtn').textContent = '▶️';
    };

    audio.onerror = () => {
      this.state.voicePlaying = false;
      document.getElementById('voicePlayBtn').textContent = '▶️';
    };

    audio.play().catch(() => {
      this.state.voicePlaying = false;
      document.getElementById('voicePlayBtn').textContent = '▶️';
    });
  },

  pauseVoice() {
    if (this.state.voiceAudio) {
      this.state.voiceAudio.pause();
      this.state.voiceAudio = null;
    }
    this.state.voicePlaying = false;
    document.getElementById('voicePlayBtn').textContent = '▶️';
  },

  seekVoice(e) {
    if (!this.state.voiceAudio) return;
    const bar = e.currentTarget;
    const rect = bar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    this.state.voiceAudio.currentTime = pct * this.state.voiceAudio.duration;
  },

  deleteVoice() {
    if (this.state.voiceAudio) {
      this.state.voiceAudio.pause();
      this.state.voiceAudio = null;
    }
    this.state.voicePlaying = false;
    this.state.voiceDataUrl = null;
    this.state.voiceChunks = [];
    document.getElementById('voiceArea').classList.remove('active');
    document.getElementById('voicePlayer').style.display = 'none';
    document.getElementById('voiceRecIndicator').classList.remove('active');
    document.getElementById('voicePlayBtn').textContent = '▶️';
    document.getElementById('voiceProgressFill').style.width = '0%';
    document.getElementById('voiceTime').textContent = '00:00';
  },

  // Load voice from saved note
  loadVoiceData(dataUrl) {
    if (!dataUrl) return;
    this.state.voiceDataUrl = dataUrl;
    this.showVoicePlayer();
  },

  clearVoiceState() {
    if (this.state.voiceAudio) {
      this.state.voiceAudio.pause();
      this.state.voiceAudio = null;
    }
    this.state.voicePlaying = false;
    this.state.voiceDataUrl = null;
    this.state.voiceChunks = [];
    if (this.state.mediaRecorder && this.state.mediaRecorder.state === 'recording') {
      this.state.mediaRecorder.stop();
    }
    if (this.state.recTimer) {
      clearInterval(this.state.recTimer);
      this.state.recTimer = null;
    }
    document.getElementById('voiceArea').classList.remove('active');
    document.getElementById('voicePlayer').style.display = 'none';
    document.getElementById('voiceRecIndicator').classList.remove('active');
    document.getElementById('voicePlayBtn').textContent = '▶️';
    document.getElementById('voiceProgressFill').style.width = '0%';
    document.getElementById('voiceTime').textContent = '00:00';
    const voiceBtn = document.getElementById('toolVoice');
    if (voiceBtn) { voiceBtn.textContent = '🎤'; voiceBtn.style.background = ''; }
  },

  // ========== Toast ==========
  toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  },
};

// Start app
App.init();

// Handle window resize
window.addEventListener('resize', () => {
  if (App.state.currentView === 'editorView') {
    App.resizeCanvas();
  }
});

// Register Service Worker (PWA 离线支持，仅 https 或 localhost 下注册)
if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => {
      console.warn('[SW] register failed:', err);
    });
  });
}
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>随手记 — 记录每一个想法</title>
<!-- PWA -->
<meta name="theme-color" content="#7C3AED">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="随手记">
<style>
/* ========== Reset & Base ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #7C3AED;
  --primary-light: #A78BFA;
  --primary-dark: #5B21B6;
  --accent: #EC4899;
  --amber: #F59E0B;
  --teal: #14B8A6;
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --text: #1E1B2E;
  --text-secondary: #6B7280;
  --text-light: #9CA3AF;
  --border: #E5E7EB;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --body-gradient: linear-gradient(135deg, #EDE9FE 0%, #FCE7F3 50%, #FEF3C7 100%);
}
[data-theme="morandi"] {
  --primary: #9B8E7E; --primary-light: #C4B8A8; --primary-dark: #6B5E4F;
  --accent: #B8A090; --amber: #C4A882; --teal: #8AA89E;
  --bg: #F0EBE3; --surface: #F0EBE3; --text: #3D3427;
  --text-secondary: #8B8178; --text-light: #B0A89C; --border: #D8D0C4;
  --shadow: 0 2px 12px rgba(0,0,0,0.06); --shadow-lg: 0 8px 30px rgba(0,0,0,0.10);
  --body-gradient: #E8E0D5;
}
[data-theme="gray"] {
  --primary: #4B5563; --primary-light: #9CA3AF; --primary-dark: #1F2937;
  --accent: #6B7280; --amber: #9CA3AF; --teal: #64748B;
  --bg: #F3F4F6; --surface: #F3F4F6; --text: #111827;
  --text-secondary: #6B7280; --text-light: #9CA3AF; --border: #D1D5DB;
  --shadow: 0 2px 12px rgba(0,0,0,0.07); --shadow-lg: 0 8px 30px rgba(0,0,0,0.10);
  --body-gradient: #F3F4F6;
}
[data-theme="purple"] {
  --primary: #7C3AED; --primary-light: #A78BFA; --primary-dark: #5B21B6;
  --accent: #D946EF; --amber: #C084FC; --teal: #818CF8;
  --bg: #F5F3FF; --surface: #F5F3FF; --text: #2E1065;
  --text-secondary: #7C3AED; --text-light: #A78BFA; --border: #DDD6FE;
  --shadow: 0 2px 12px rgba(124,58,237,0.10); --shadow-lg: 0 8px 30px rgba(124,58,237,0.15);
  --body-gradient: #F5F3FF;
}
[data-theme="blue"] {
  --primary: #2563EB; --primary-light: #60A5FA; --primary-dark: #1D4ED8;
  --accent: #06B6D4; --amber: #3B82F6; --teal: #0EA5E9;
  --bg: #EFF6FF; --surface: #EFF6FF; --text: #1E3A5F;
  --text-secondary: #3B82F6; --text-light: #93C5FD; --border: #DBEAFE;
  --shadow: 0 2px 12px rgba(59,130,246,0.10); --shadow-lg: 0 8px 30px rgba(59,130,246,0.15);
  --body-gradient: #EFF6FF;
}
[data-theme="dark"] {
  --primary: #818CF8; --primary-light: #A5B4FC; --primary-dark: #6366F1;
  --accent: #F472B6; --amber: #FBBF24; --teal: #2DD4BF;
  --bg: #111111; --surface: #111111; --text: #E4E4E7;
  --text-secondary: #A1A1AA; --text-light: #71717A; --border: #27272A;
  --shadow: 0 2px 12px rgba(0,0,0,0.5); --shadow-lg: 0 8px 30px rgba(0,0,0,0.6);
  --body-gradient: #09090B;
}
[data-theme="pink"] {
  --primary: #EC4899; --primary-light: #F472B6; --primary-dark: #BE185D;
  --accent: #F97316; --amber: #FBBF24; --teal: #F472B6;
  --bg: #FFF1F2; --surface: #FFF1F2; --text: #4A1024;
  --text-secondary: #BE185D; --text-light: #F9A8D4; --border: #FCE7F3;
  --shadow: 0 2px 12px rgba(236,72,153,0.10); --shadow-lg: 0 8px 30px rgba(236,72,153,0.15);
  --body-gradient: #FFF1F2;
}
html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--body-gradient);
  color: var(--text);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ========== Phone Frame ========== */
#app {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  padding: 20px;
}
.phone-frame {
  width: 420px;
  max-width: 100%;
  height: 860px;
  max-height: 100vh;
  background: var(--bg);
  border-radius: 40px;
  overflow: hidden;
  box-shadow: 0 0 0 12px var(--text), 0 0 0 14px var(--border), var(--shadow-lg);
  position: relative;
  display: flex;
  flex-direction: column;
}
.phone-frame::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 150px;
  height: 28px;
  background: var(--text);
  border-radius: 0 0 18px 18px;
  z-index: 1000;
}
@media (max-width: 480px) {
  #app { padding: 0; }
  .phone-frame {
    width: 100%;
    height: 100vh;
    border-radius: 0;
    box-shadow: none;
  }
  .phone-frame::before { display: none; }
}

/* ========== Views ========== */
.view {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
  animation: fadeIn 0.3s ease;
}
.view.active { display: flex; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ========== Status Bar ========== */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 28px 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  flex-shrink: 0;
}
.status-bar .time { font-variant-numeric: tabular-nums; }
.status-bar .icons { display: flex; gap: 5px; align-items: center; }
.status-bar .icons span { font-size: 11px; }

/* ========== Home View ========== */
.home-header {
  padding: 8px 20px 12px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.home-header-left { flex: 1; display: flex; align-items: center; gap: 10px; }
.home-title {
  font-size: 22px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.home-subtitle {
  font-size: 12px;
  color: var(--text-secondary);
}
.theme-btn {
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 50%;
  width: 34px;
  height: 34px;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  flex-shrink: 0;
}
.theme-btn:active { transform: scale(0.9); }
.sidebar-toggle {
  background: none; border: none; font-size: 22px; cursor: pointer;
  padding: 4px; color: var(--text); transition: var(--transition);
  flex-shrink: 0;
}
.sidebar-toggle:active { transform: scale(0.9); }

/* Two-panel home layout */
.home-body {
  flex: 1; display: flex; overflow: hidden; position: relative;
}

/* Sidebar */
.home-sidebar {
  position: absolute; left: 0; top: 0; bottom: 0; z-index: 50;
  width: 180px; background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 2px 0 12px rgba(0,0,0,0.08);
}
.home-sidebar.open { transform: translateX(0); }
.sidebar-header {
  font-size: 14px; font-weight: 700; color: var(--text);
  padding: 14px 14px 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-col-list {
  flex: 1; overflow-y: auto; padding: 0 8px 8px;
}
.sidebar-col-list::-webkit-scrollbar { width: 0; }
.sidebar-col-item {
  display: flex; align-items: center; gap: 8px; padding: 10px 10px;
  border-radius: 10px; cursor: pointer; transition: var(--transition);
  margin-bottom: 2px; position: relative;
}
.sidebar-col-item:active { transform: scale(0.97); }
.sidebar-col-item.active { background: var(--bg); }
.sidebar-col-item .col-icon { font-size: 16px; flex-shrink: 0; }
.sidebar-col-item .col-name {
  font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.sidebar-col-item .col-count {
  font-size: 11px; color: var(--text-light); margin-left: auto; flex-shrink: 0;
}
.sidebar-col-item .col-bar {
  position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px;
  border-radius: 0 3px 3px 0;
}
.sidebar-add-col {
  display: flex; align-items: center; gap: 6px; padding: 10px;
  margin: 4px 8px 8px; border-radius: 10px; border: 1.5px dashed var(--border);
  cursor: pointer; font-size: 12px; color: var(--text-secondary);
  transition: var(--transition);
}
.sidebar-add-col:active { border-color: var(--primary); color: var(--primary); }

/* Sidebar overlay for mobile */
.sidebar-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.3); z-index: 49;
  display: none;
}
.sidebar-overlay.show { display: block; }

/* Main content (right panel) */
.home-main {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  padding: 0 16px;
}
.home-main-header {
  font-size: 13px; font-weight: 700; color: var(--text-secondary);
  padding: 4px 4px 10px; flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
}
.home-main-header .count {
  font-size: 11px; color: var(--text-light); font-weight: 500;
  background: var(--bg); padding: 2px 8px; border-radius: 20px;
}
.note-list {
  flex: 1; overflow-y: auto; display: flex; flex-direction: column;
  gap: 10px; padding-bottom: 90px;
}
.note-list::-webkit-scrollbar { width: 0; }
.note-item {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 12px;
}
.note-item:active { transform: translateX(var(--swipe-x, 0px)) scale(0.98); }
.note-item .note-preview {
  width: 44px; height: 44px; border-radius: 8px; flex-shrink: 0;
  background: var(--bg); display: flex; align-items: center;
  justify-content: center; font-size: 20px; overflow: hidden;
}
.note-item .note-info { flex: 1; min-width: 0; }
.note-item .note-title {
  font-size: 14px; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.note-item .note-meta {
  font-size: 11px; color: var(--text-light); margin-top: 2px;
  display: flex; gap: 8px; align-items: center;
}
.note-item .note-tag {
  font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 600;
}
.note-item .note-text-preview {
  font-size: 12px; color: var(--text-secondary); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
}

/* ========== Swipe-to-Delete ========== */
.note-swipe {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
}
.note-swipe .note-delete-btn {
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 76px;
  border: none;
  background: #EF4444;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border-radius: var(--radius-sm);
  font-family: inherit;
}
.note-swipe .note-delete-btn span { font-size: 20px; line-height: 1; }
.note-swipe .note-delete-btn:active { background: #DC2626; }
.note-swipe .note-item {
  position: relative;
  transform: translateX(var(--swipe-x, 0px));
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  will-change: transform;
}
.note-swipe.dragging .note-item { transition: none; }
.empty-state {
  text-align: center; padding: 40px 20px; color: var(--text-light);
}
.empty-state .emoji { font-size: 48px; display: block; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* Legacy collection-grid for collection detail view */
.collection-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
}
.collection-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 16px 10px; text-align: center; cursor: pointer;
  transition: var(--transition); border: 2px solid transparent;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.collection-card:active { transform: scale(0.95); }
.collection-card .icon { font-size: 28px; display: block; margin-bottom: 6px; }
.collection-card .name { font-size: 13px; font-weight: 600; color: var(--text); }
.collection-card .note-count { font-size: 11px; color: var(--text-light); margin-top: 2px; }
.collection-card .color-bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
}
.add-collection-btn {
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); border: 2px dashed var(--border);
  border-radius: 16px; cursor: pointer; transition: var(--transition);
  min-height: 80px; font-size: 14px; color: var(--text-secondary); gap: 6px;
}
.add-collection-btn:active { transform: scale(0.95); }

/* FAB */
.fab {
  position: absolute;
  bottom: 24px;
  right: 24px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border: none;
  color: white;
  /* Keep fab text white regardless of theme */
  font-size: 30px;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
  transition: var(--transition);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
}
.fab:active { transform: scale(0.9); }

/* ========== Editor View ========== */
.editor-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px 10px;
  background: var(--surface);
  box-shadow: 0 1px 6px rgba(0,0,0,0.05);
  flex-shrink: 0;
  z-index: 10;
}
.editor-header .btn-back {
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  padding: 6px;
  color: var(--primary);
  transition: var(--transition);
}
.editor-header .btn-back:active { transform: scale(0.9); }
.editor-header .title-input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  background: transparent;
}
.editor-header .title-input::placeholder { color: var(--text-light); }
.editor-header .btn-save {
  background: var(--primary);
  color: white;
  border: none;
  padding: 7px 18px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}
.editor-header .btn-save:active { transform: scale(0.95); }

/* Paper Area */
.paper-area {
  flex: 1;
  overflow-y: auto;
  position: relative;
  -webkit-overflow-scrolling: touch;
}
.paper-area::-webkit-scrollbar { width: 0; }
.paper-container {
  position: relative;
  min-height: 100%;
  width: 100%;
}
.paper-bg {
  position: absolute;
  inset: 0;
  min-height: 100%;
}
.draw-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
}
.draw-canvas-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
  pointer-events: none;
  z-index: 5;
}
.text-layer {
  position: absolute;
  inset: 0;
  padding: 24px 20px;
  outline: none;
  font-size: 16px;
  line-height: 1.8;
  color: var(--text);
  word-break: break-word;
  min-height: 100%;
  caret-color: var(--primary);
}
.text-layer:empty::before {
  content: attr(data-placeholder);
  color: var(--text-light);
  pointer-events: none;
}

/* Editor Toolbar */
.editor-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  padding: 8px 10px;
  background: var(--surface);
  box-shadow: 0 -1px 6px rgba(0,0,0,0.06);
  flex-shrink: 0;
  row-gap: 6px;
}
.tool-btn {
  background: var(--bg);
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  flex-shrink: 0;
  color: var(--text);
}
.tool-btn:active { transform: scale(0.9); }
.tool-btn.active {
  background: var(--primary);
  color: white;
}
.tool-divider {
  width: 1px;
  height: 24px;
  background: var(--border);
  flex-shrink: 0;
}
.color-palette {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.color-dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 1px var(--border);
  transition: var(--transition);
  flex-shrink: 0;
}
.color-dot:active { transform: scale(0.85); }
.color-dot.active {
  box-shadow: 0 0 0 2px var(--primary);
  transform: scale(1.15);
}
.opacity-slider-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: 2px;
  flex-shrink: 0;
}
.opacity-slider-wrap label {
  font-size: 10px;
  color: var(--text-secondary);
  white-space: nowrap;
}
.opacity-slider {
  width: 36px;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--border);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.opacity-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--primary);
  cursor: pointer;
}
.opacity-value {
  font-size: 10px;
  color: var(--text-secondary);
  min-width: 24px;
  text-align: center;
}
.color-current-preview {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 1px var(--border);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.color-current-preview::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 0 0 / 8px 8px;
}
.color-current-preview .fill {
  position: absolute;
  inset: 0;
  border-radius: 50%;
}
.brush-size-btn {
  background: var(--bg);
  border: none;
  border-radius: 8px;
  padding: 4px 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  flex-shrink: 0;
  transition: var(--transition);
}
.brush-size-btn:active { transform: scale(0.9); }
.brush-size-btn .dot {
  border-radius: 50%;
  background: var(--text);
}
.eraser-size-btn .dot {
  border-radius: 50%;
  background: var(--text-light);
  border: 1px dashed var(--border);
}

/* ========== Background Picker ========== */
.bg-picker-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px 10px;
  background: var(--surface);
  box-shadow: 0 1px 6px rgba(0,0,0,0.05);
  flex-shrink: 0;
}
.bg-picker-header h2 { font-size: 17px; font-weight: 700; flex: 1; }
.bg-picker-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}
.bg-picker-content::-webkit-scrollbar { width: 0; }
.bg-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.bg-card {
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: var(--transition);
  border: 3px solid transparent;
  box-shadow: var(--shadow);
  position: relative;
  aspect-ratio: 3 / 4;
}
.bg-card:active { transform: scale(0.96); }
.bg-card.selected { border-color: var(--primary); }
.bg-card .preview {
  width: 100%;
  height: 100%;
}
.bg-card .label {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;

/* ========== Custom BG Maker ========== */
.custom-bg-header {

}
.pattern-card {

}
.pattern-card:active { transform: scale(0.92); }
.pattern-card.selected { border-color: var(--primary); }
.pattern-card .pattern-preview {

}
.pattern-card .pattern-name {

  bottom: 0;
  left: 0;
  right: 0;
  padding: 3px 6px;
  font-size: 11px;
  font-weight: 600;

}
.custom-pattern-btn {

/* ========== Collection Modal ========== */
.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 998;
  display: none;
  align-items: flex-end;
  justify-content: center;
  animation: fadeInOverlay 0.2s ease;
}
.modal-overlay.active { display: flex; }
@keyframes fadeInOverlay {
  from { opacity: 0; }
  to { opacity: 1; }
}
.modal-sheet {
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  width: 100%;
  padding: 20px 20px 32px;
  animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-sheet .modal-handle {
  width: 40px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 16px;
}
.modal-sheet h3 {
  font-size: 18px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 4px;
}
.modal-sheet .modal-desc {
  font-size: 13px;
  color: var(--text-secondary);

  margin-bottom: 18px;
}
.modal-collection-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.modal-collection-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-radius: 12px;
  cursor: pointer;
  transition: var(--transition);
  background: var(--bg);
}
.modal-collection-item:active { transform: scale(0.98); }
.modal-collection-item .icon {
  font-size: 24px;
  width: 44px;
  height: 44px;

  align-items: center;

.modal-collection-item .name {

  font-size: 15px;

}

}
.modal-collection-item.selected .check { opacity: 1; }
.modal-collection-item.selected { background: var(--primary-light); background: rgba(124, 58, 237, 0.1); }
.modal-collection-item.skip {
  justify-content: center;
  color: var(--text-secondary);
  font-size: 14px;
  background: transparent;
}

/* ========== Toast ========== */
.toast {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(30, 27, 46, 0.92);
  color: white;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  z-index: 9999;
  opacity: 0;
  transition: 0.3s ease;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ========== Collection View ========== */
.collection-view-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px 10px;
  background: var(--surface);
  box-shadow: 0 1px 6px rgba(0,0,0,0.05);

}

}
.collection-view-header h2 { font-size: 17px; font-weight: 700; flex: 1; }
.collection-view-header .col-icon { font-size: 24px; }

/* ========== Collection Management ========== */
.add-collection-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  border: 2px dashed var(--border);
  border-radius: 16px;

  min-height: 80px;
  font-size: 14px;
  color: var(--text-secondary);
  gap: 6px;
}
.add-collection-btn:hover { border-color: var(--primary); color: var(--primary); }

.collection-card .rename-btn {

  right: 4px;

  height: 22px;
  background: rgba(255,255,255,0.8);

  border-radius: 50%;
  font-size: 10px;

.collection-card:hover .rename-btn,

.col-manage-modal .icon-picker {

}
.col-manage-modal .icon-pick-item {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;

}
.col-manage-modal .icon-pick-item:hover { background: var(--primary-light); }
.col-manage-modal .icon-pick-item.active { background: rgba(124,58,237,0.15); box-shadow: 0 0 0 2px var(--primary); }
.col-manage-modal .color-picker-row {
  display: flex;

  margin: 8px 0;
  flex-wrap: wrap;
}
.col-manage-modal .col-color-dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 1px var(--border);

}
.col-manage-modal .col-color-dot.active { box-shadow: 0 0 0 2px var(--primary); transform: scale(1.1); }
.col-manage-modal input[type="text"] {

  font-size: 14px;
  font-weight: 600;

/* ========== Redraw Choice Modal ========== */
.redraw-choice-modal {

.redraw-choice-actions .btn-clear {

.col-manage-modal .modal-actions .btn-cancel { background: var(--bg); color: var(--text-secondary); }
.col-manage-modal .modal-actions .btn-confirm { background: var(--primary); color: white; }

/* ========== Theme Modal ========== */
.theme-modal-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 998;
  display: none; align-items: flex-end; justify-content: center;
}
.theme-modal-overlay.active { display: flex; }
.theme-sheet {
  background: var(--surface); border-radius: 24px 24px 0 0;
  width: 100%; padding: 20px 20px 32px;
  animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
.theme-card {
  padding: 16px; border-radius: 14px; cursor: pointer; transition: var(--transition);
  border: 3px solid var(--border); text-align: center; background: var(--bg);
}
.theme-card.selected { border-color: var(--primary); }

.theme-card .theme-preview {

}
.theme-card .theme-swatch {

}

/* ========== Image Crop Modal ========== */
.image-crop-modal {
  position: absolute; inset: 0; background: rgba(0,0,0,0.7); z-index: 999;
  display: none; flex-direction: column;
}

  background: var(--surface); flex-shrink: 0;
}
.image-crop-header h3 { font-size: 16px; font-weight: 700; flex: 1; }
.image-crop-header button {
  background: none; border: none; font-size: 14px; font-weight: 600;
  cursor: pointer; padding: 6px 12px; border-radius: 8px;
}
.image-crop-header .btn-crop-cancel { color: var(--text-secondary); }
.image-crop-header .btn-crop-done { background: var(--primary); color: white; }
.image-crop-body {
  flex: 1; display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.image-crop-body canvas { max-width: 100%; max-height: 100%; touch-action: none; }
.image-crop-tip {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.7); color: white; padding: 8px 16px;
  border-radius: 20px; font-size: 12px; pointer-events: none; white-space: nowrap;

.image-crop-choice {

}
.image-crop-choice.active { display: flex; }
.image-crop-choice button {
  padding: 10px 24px; border-radius: 20px; border: none;
  font-size: 14px; font-weight: 600; cursor: pointer;
  background: var(--surface); color: var(--text);
  box-shadow: var(--shadow);

.image-crop-choice button:active { transform: scale(0.95); }

/* ========== Voice Recording ========== */
.voice-area {
  padding: 10px 20px 4px; flex-shrink: 0; display: none;
}
.voice-area.active { display: block; }
.voice-player {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
}
.voice-player .play-btn {
  width: 38px; height: 38px; border-radius: 50%; border: none;
  background: var(--primary); color: white; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: var(--transition);
}
.voice-player .play-btn:active { transform: scale(0.9); }
.voice-player .voice-progress {
  flex: 1; height: 4px; background: var(--border); border-radius: 2px;
  position: relative; overflow: hidden;
}
.voice-player .voice-progress-fill {
  height: 100%; background: var(--primary); border-radius: 2px;
  transition: width 0.1s linear; width: 0%;
}
.voice-player .voice-time {
  font-size: 11px; color: var(--text-secondary); min-width: 32px; text-align: right;
}
.voice-player .delete-voice {
  background: none; border: none; font-size: 16px; cursor: pointer; padding: 4px;
  color: var(--text-light); transition: var(--transition);
}
.voice-recording-indicator {
  display: none; align-items: center; gap: 8px; padding: 10px 14px;
  background: #FEE2E2; border-radius: 12px;
}
.voice-recording-indicator.active { display: flex; }
.voice-recording-indicator .rec-dot {
  width: 12px; height: 12px; border-radius: 50%; background: #EF4444;
  animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.3); }
}
.voice-recording-indicator .rec-time {
  font-size: 14px; font-weight: 600; color: #EF4444; font-variant-numeric: tabular-nums;
}
.voice-recording-indicator .stop-rec {
  margin-left: auto; background: #EF4444; color: white; border: none;
  width: 32px; height: 32px; border-radius: 50%; font-size: 14px; cursor: pointer;
}

/* ========== Inserted Image Controls ========== */
.inserted-image-wrapper {
  position: relative; display: inline-block; max-width: 100%;
  margin: 8px 0; border-radius: 8px; overflow: visible;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer;
  resize: both; min-width: 60px; min-height: 60px;
  user-select: none; -webkit-user-select: none;
}
.inserted-image-wrapper img {
  display: block; max-width: 100%; width: 100%; height: auto;
  border-radius: 8px; pointer-events: none;
  transition: transform 0.2s ease;
}

  // ========== Storage ==========
  getNotes() {
    try { return JSON.parse(localStorage.getItem('suiShouJi_notes') || '[]'); }
    catch { return []; }

  saveNotes(notes) {
    localStorage.setItem('suiShouJi_notes', JSON.stringify(notes));
  },

  getCollections() {
    try {
      const saved = JSON.parse(localStorage.getItem('suiShouJi_collections') || 'null');
      if (saved && saved.length > 0) return saved;
    } catch {}
    return this.defaultCollections;
  },
  saveCollections(cols) {

  // ========== Init ==========
  init() {
    this.collections = this.getCollections();
    this.initPresets();
    this.initPatterns();
    this.renderColorPalette();
    this.renderBgColors();
    this.renderPatterns();
    this.loadTheme();
    this.renderHome();
    this.updateStatusTime();
    setInterval(() => this.updateStatusTime(), 30000);
    this.initDrawCanvas();
    this.initPatternCanvas();
    this.initFullPageCanvas();
    this.initImageCropCanvas();
    this.updateBrushDot();
    this.updateEraserDot();
    this.initPasteHandler();
    this.initImageControlHandler();
    this.initSwipeToDelete();
  },

  initImageControlHandler() {
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.img-ctrl-btn');
      if (!btn) {
        // If clicking outside, deactivate all image controls
        if (!e.target.closest('.inserted-image-wrapper')) {
          document.querySelectorAll('.inserted-image-wrapper.active').forEach(w => w.classList.remove('active'));
        }
        return;
      }
      e.preventDefault();
      const wrapper = btn.closest('.inserted-image-wrapper');
      const img = wrapper.querySelector('img');
      const action = btn.dataset.action;
      let rotate = parseFloat(wrapper.dataset.rotate) || 0;
      let w = wrapper.offsetWidth;

      if (action === 'rotl') {
        rotate -= 90;
        wrapper.dataset.rotate = rotate;
        img.style.transform = `rotate(${rotate}deg)`;
      } else if (action === 'rotr') {
        rotate += 90;
        wrapper.dataset.rotate = rotate;
        img.style.transform = `rotate(${rotate}deg)`;
      } else if (action === 'shrink') {
        w = Math.max(80, w * 0.7);
        wrapper.style.width = w + 'px';
      } else if (action === 'grow') {
        w = Math.min(400, w * 1.4);
        wrapper.style.width = w + 'px';
      }
    });

    // Toggle controls on image tap
    document.addEventListener('click', (e) => {
      const wrapper = e.target.closest('.inserted-image-wrapper');
      if (!wrapper) return;
      if (e.target.closest('.img-ctrl-btn')) return; // Let btn handler deal with it
      document.querySelectorAll('.inserted-image-wrapper.active').forEach(w => {
        if (w !== wrapper) w.classList.remove('active');
      });
      wrapper.classList.toggle('active');
    });
  },

  initPasteHandler() {
    document.addEventListener('paste', (e) => {
      if (this.state.currentView !== 'editorView') return;
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = (ev) => {
            this.openImageCrop(ev.target.result);
          };
          reader.readAsDataURL(blob);
          return;
        }
      }
    });
  },

  updateStatusTime() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('statusTime').textContent = `${h}:${m}`;
  },

  // ========== Navigation ==========
  showView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    this.state.currentView = viewId;
  },

  // ========== Home Render ==========
  renderHome() {
    const notes = this.getNotes();

    // Sidebar collections
    const activeCol = this.state.activeSidebarCol || null;
    const sidebarList = document.getElementById('sidebarColList');
    sidebarList.innerHTML = this.collections.map(col => {
      const count = notes.filter(n => n.collection === col.id).length;
      return `
        <div class="sidebar-col-item ${col.id === activeCol ? 'active' : ''}" onclick="App.filterByCollection('${col.id}')" oncontextmenu="event.preventDefault(); App.showRenameCollectionModal('${col.id}')">
          <span class="col-bar" style="background:${col.color}"></span>
          <span class="col-icon">${col.icon}</span>
          <span class="col-name">${col.name}</span>
          <span class="col-count">${count}</span>
        </div>
      `;
    }).join('');
    document.getElementById('sidebarNoteCount').textContent = notes.length;

    // Notes list
    const list = document.getElementById('noteList');
    let filtered = [...notes].sort((a, b) => b.updatedAt - a.updatedAt);
    if (activeCol) {
      filtered = filtered.filter(n => n.collection === activeCol);
    }
    const recent = filtered.slice(0, 50);
    document.getElementById('recentCount').textContent = filtered.length;
    const activeColLabel = document.getElementById('activeColLabel');
    if (activeCol) {
      const col = this.collections.find(c => c.id === activeCol);
      activeColLabel.textContent = col ? '▸ ' + col.name : '';
    } else {
      activeColLabel.textContent = '';
    }

    if (recent.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <span class="emoji">✨</span>
          <p>${activeCol ? '这个合集还没有笔记' : '还没有笔记，点右下角 + 开始记录吧'}</p>
        </div>
      `;
    } else {
      list.innerHTML = recent.map(n => this.renderNoteItem(n)).join('');
    }
  },

  toggleSidebar() {
    const sidebar = document.getElementById('homeSidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const isOpen = sidebar.classList.contains('open');
    if (isOpen) {
      this.closeSidebar();
    } else {
      sidebar.classList.add('open');
      overlay.classList.add('show');
    }
  },

  closeSidebar() {
    document.getElementById('homeSidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  },

  filterByCollection(colId) {
    if (this.state.activeSidebarCol === colId) {
      this.state.activeSidebarCol = null;
    } else {
      this.state.activeSidebarCol = colId;
    }
    this.closeSidebar();
    this.renderHome();
  },

  // ========== Swipe-to-Delete ==========
  swipeWidth: 76, // 与 CSS 中 .note-delete-btn 宽度一致

  initSwipeToDelete() {
    ['noteList', 'colNoteList'].forEach(id => {
      const list = document.getElementById(id);
      if (!list) return;
      list.addEventListener('pointerdown', (e) => this.swipeStart(e));
      list.addEventListener('pointermove', (e) => this.swipeMove(e));
      list.addEventListener('pointerup', (e) => this.swipeEnd(e));
      list.addEventListener('pointercancel', (e) => this.swipeEnd(e));
      list.addEventListener('scroll', () => this.closeAllSwipes(), { passive: true });
    });
  },

  swipeStart(e) {
    const wrap = e.target.closest('.note-swipe');
    if (!wrap || e.target.closest('.note-delete-btn')) return;
    // 打开新的滑动项时，收起其他已打开的项
    this.closeAllSwipes(wrap);
    this.state.swipe = {
      wrap,
      startX: e.clientX,
      startY: e.clientY,
      baseX: this.getSwipeX(wrap),
      horizontal: null,
    };
    wrap.classList.add('dragging');
  },

  swipeMove(e) {
    const s = this.state.swipe;
    if (!s) return;
    const dx = e.clientX - s.startX;
    const dy = e.clientY - s.startY;
    if (s.horizontal === null) {
      // 移动超过阈值前不判断方向，避免与点击冲突
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      s.horizontal = Math.abs(dx) > Math.abs(dy);
      if (!s.horizontal) { this.swipeEnd(e); return; } // 垂直滚动交给浏览器
      if (s.wrap.setPointerCapture) {
        try { s.wrap.setPointerCapture(e.pointerId); } catch {}
      }
    }
    if (!s.horizontal) return;
    e.preventDefault();
    const x = Math.max(-this.swipeWidth, Math.min(0, s.baseX + dx));
    this.setSwipeX(s.wrap, x);
  },

  swipeEnd(e) {
    const s = this.state.swipe;
    if (!s) return;
    s.wrap.classList.remove('dragging');
    if (s.horizontal) {
      // 松手后吸附：滑过一半则展开，否则回弹
      const open = this.getSwipeX(s.wrap) < -this.swipeWidth / 2;
      this.setSwipeX(s.wrap, open ? -this.swipeWidth : 0);
      s.wrap.classList.toggle('open', open);
      // 吞掉本次手势产生的 click，避免误触编辑/删除
      const block = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
      s.wrap.addEventListener('click', block, { capture: true, once: true });
    }
    this.state.swipe = null;
  },

  setSwipeX(wrap, x) {
    wrap.style.setProperty('--swipe-x', x + 'px');
  },

  getSwipeX(wrap) {
    return parseFloat(wrap.style.getPropertyValue('--swipe-x')) || 0;
  },

  closeAllSwipes(except) {
    document.querySelectorAll('.note-swipe.open').forEach(w => {
      if (w === except) return;
      w.classList.remove('open');
      this.setSwipeX(w, 0);
    });
  },

  deleteNoteById(noteId) {
    const notes = this.getNotes().filter(n => n.id !== noteId);
    this.saveNotes(notes);
    // 如果正在编辑的就是这条笔记，返回首页
    if (this.state.currentNote && this.state.currentNote.id === noteId) {
      this.state.currentNote = null;
      this.showView('homeView');
    }
    // 在合集详情页删除时，同步刷新当前列表
    if (this.state.currentView === 'collectionView' && this.state.currentCollectionId) {
      this.openCollection(this.state.currentCollectionId);
    }
    this.renderHome();
    this.toast('🗑️ 笔记已删除');
  },

  renderNoteItem(n) {
    const col = this.collections.find(c => c.id === n.collection);
    const date = new Date(n.updatedAt || n.createdAt);
    const dateStr = `${date.getMonth()+1}月${date.getDate()}日 ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    const previewText = (n.text || '').replace(/<[^>]*>/g, '').substring(0, 40) || '空白笔记';
    const hasDrawing = n.drawingData ? '🎨 ' : '';
    const hasVoice = n.voiceData ? '🎙️ ' : '';
    return `
      <div class="note-swipe" data-id="${n.id}">
        <button class="note-delete-btn" onclick="App.deleteNoteById('${n.id}')" title="删除笔记">
          <span>🗑️</span>删除
        </button>
        <div class="note-item" onclick="App.editNote('${n.id}')">
          <div class="note-preview" style="background:${this.getNotePreviewBg(n)}">
            ${n.drawingData ? '🎨' : n.voiceData ? '🎙️' : (col ? col.icon : '📝')}
          </div>
          <div class="note-info">
            <div class="note-title">${n.title || '无标题'}</div>
            <div class="note-text-preview">${hasDrawing}${hasVoice}${previewText}</div>
            <div class="note-meta">
              <span>${dateStr}</span>
              ${col ? `<span class="note-tag" style="background:${col.color}22;color:${col.color}">${col.name}</span>` : ''}
            </div>
          </div>
        </div>
      </div>
    `;
  },

  getNotePreviewBg(n) {
    if (n.background) {
      if (n.background.type === 'preset') {
        const p = this.presets.find(p => p.id === n.background.presetId);
        if (p) return p.previewBg || p.bg || '#FFF';
      } else if (n.background.type === 'custom') {
        return n.background.color || '#FFF';
      }
    }
    return '#F5F3FF';
  },

  // ========== Collection View ==========
  openCollection(colId) {
    const col = this.collections.find(c => c.id === colId);
    if (!col) return;
    this.state.currentCollectionId = colId;
    document.getElementById('colDetailIcon').textContent = col.icon;
    document.getElementById('colDetailTitle').textContent = col.name;
    
    const notes = this.getNotes().filter(n => n.collection === colId).sort((a,b) => b.updatedAt - a.updatedAt);
    const list = document.getElementById('colNoteList');
    const empty = document.getElementById('colEmptyState');
    
    if (notes.length === 0) {
      list.innerHTML = '';
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      list.innerHTML = notes.map(n => this.renderNoteItem(n)).join('');
    }
    this.showView('collectionView');
  },

  // ========== Editor ==========
  openEditor() {
    this.state.currentNote = null;
    this.state.drawHistory = [];
    this.clearVoiceState();
    document.getElementById('noteTitle').value = '';
    document.getElementById('textLayer').innerHTML = '';
    this.setMode('text');
    // Default background
    this.state.currentBg = { type: 'preset', presetId: 'blank' };
    this.applyBackground();
    this.clearDrawCanvas();
    this.showView('editorView');
    setTimeout(() => this.resizeCanvas(), 100);
  },

  editNote(noteId) {
    // 如果该项正处于左滑展开状态，点击只收起，不进入编辑
    const openWrap = document.querySelector(`.note-swipe.open[data-id="${noteId}"]`);
    if (openWrap) {
      this.closeAllSwipes();
      return;
    }
    const note = this.getNotes().find(n => n.id === noteId);
    if (!note) return;
    this.state.currentNote = note;
    this.state.drawHistory = [];
    this.clearVoiceState();
    document.getElementById('noteTitle').value = note.title || '';
    document.getElementById('textLayer').innerHTML = note.text || '';
    this.state.currentBg = note.background || { type: 'preset', presetId: 'blank' };
    this.applyBackground();
    this.setMode('text');
    this.showView('editorView');
    setTimeout(() => {
      this.resizeCanvas();
      if (note.drawingData) {
        this.loadDrawing(note.drawingData);
      }
      if (note.voiceData) {
        this.loadVoiceData(note.voiceData);
      }
    }, 200);
  },

  handleBack() {
    // Auto-save before going back
    const title = document.getElementById('noteTitle').value.trim();
    const text = document.getElementById('textLayer').innerHTML.trim();
    const hasDrawing = this.hasDrawing();
    
    if (title || text || hasDrawing) {
      this.saveNote(true); // silent save
    }
    if (this.state.currentCollectionId) {
      this.openCollection(this.state.currentCollectionId);
    } else {
      this.renderHome();
      this.showView('homeView');
    }
  },

  setMode(mode) {
    this.state.mode = mode;
    const textLayer = document.getElementById('textLayer');
    const canvas = document.getElementById('drawCanvas');
    
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    
    // Show/hide brush vs eraser size buttons
    const brushBtn = document.getElementById('editorBrushBtn');
    const eraserBtn = document.getElementById('editorEraserBtn');
    
    if (mode === 'text') {
      textLayer.style.pointerEvents = 'auto';
      canvas.style.pointerEvents = 'none';
      document.getElementById('toolText').classList.add('active');
      brushBtn.style.display = '';
      eraserBtn.style.display = 'none';
    } else if (mode === 'draw') {
      textLayer.style.pointerEvents = 'none';
      canvas.style.pointerEvents = 'auto';
      document.getElementById('toolDraw').classList.add('active');
      brushBtn.style.display = '';
      eraserBtn.style.display = 'none';
    } else if (mode === 'eraser') {
      textLayer.style.pointerEvents = 'none';
      canvas.style.pointerEvents = 'auto';
      document.getElementById('toolEraser').classList.add('active');
      brushBtn.style.display = 'none';
      eraserBtn.style.display = '';
    }
    this.updateBrushDot();
    this.updateEraserDot();
  },

  // ========== Drawing Canvas ==========
  initDrawCanvas() {
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('drawCanvasOverlay');
    const overlayCtx = overlay.getContext('2d');
    
    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const touch = e.touches ? e.touches[0] : e;
      return {
        x: (touch.clientX - rect.left) * scaleX,
        y: (touch.clientY - rect.top) * scaleY,
      };
    };

    const startDraw = (e) => {
      if (this.state.mode !== 'draw' && this.state.mode !== 'eraser') return;
      e.preventDefault();
      this.state.isDrawing = true;
      const pos = getPos(e);
      this.state.lastX = pos.x;
      this.state.lastY = pos.y;
      // Save state for undo
      this.saveDrawState();
      // Prepare overlay for transparent strokes
      if (this.state.mode === 'draw') {
        overlay.width = canvas.width;
        overlay.height = canvas.height;
        overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
        overlay.style.opacity = this.state.drawOpacity;
        overlay.style.pointerEvents = 'none';
      }
    };

    const draw = (e) => {
      if (!this.state.isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);
      
      if (this.state.mode === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = this.state.eraserSizes[this.state.eraserIndex];
        ctx.strokeStyle = 'rgba(0,0,0,1)';
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(this.state.lastX, this.state.lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
      } else {
        // Draw on overlay at full opacity - CSS opacity handles transparency
        overlayCtx.globalCompositeOperation = 'source-over';
        overlayCtx.lineJoin = 'round';
        overlayCtx.lineCap = 'round';
        overlayCtx.lineWidth = this.state.brushSizes[this.state.brushIndex];
        overlayCtx.strokeStyle = this.state.drawColor;
        overlayCtx.beginPath();
        overlayCtx.moveTo(this.state.lastX, this.state.lastY);
        overlayCtx.lineTo(pos.x, pos.y);
        overlayCtx.stroke();
      }
      
      this.state.lastX = pos.x;
      this.state.lastY = pos.y;
    };

    const endDraw = () => {
      if (this.state.isDrawing && this.state.mode === 'draw') {
        // Composite overlay onto main canvas with proper opacity
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = this.state.drawOpacity;
        ctx.drawImage(overlay, 0, 0);
        ctx.globalAlpha = 1.0;
        // Clear overlay
        overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
        overlay.style.opacity = 0;
      }
      this.state.isDrawing = false;
    };

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', endDraw);
  },

  resizeCanvas() {
    const canvas = document.getElementById('drawCanvas');
    const container = document.getElementById('paperContainer');
    const rect = container.getBoundingClientRect();
    const w = rect.width;
    const h = Math.max(rect.height, container.parentElement.clientHeight);
    
    // Save existing drawing
    let existingData = null;
    if (canvas.width > 0 && canvas.height > 0) {
      try { existingData = canvas.toDataURL(); } catch {}
    }
    
    canvas.width = w;
    canvas.height = h;
    
    // Resize overlay canvas too
    const overlay = document.getElementById('drawCanvasOverlay');
    overlay.width = w;
    overlay.height = h;
    overlay.style.opacity = 0;
    
    if (existingData) {
      const img = new Image();
      img.onload = () => {
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
      };
      img.src = existingData;
    }
  },

  clearDrawCanvas() {
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  },

  hasDrawing() {
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    try {
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      return imageData.data.some(channel => channel !== 0);
    } catch { return false; }
  },

  saveDrawState() {
    const canvas = document.getElementById('drawCanvas');
    try {
      const data = canvas.toDataURL();
      this.state.drawHistory.push(data);
      if (this.state.drawHistory.length > this.state.maxHistory) {
        this.state.drawHistory.shift();
      }
    } catch {}
  },

  undoDraw() {
    if (this.state.drawHistory.length === 0) {
      this.toast('没有可撤销的操作');
      return;
    }
    const data = this.state.drawHistory.pop();
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
    };
    img.src = data;
  },

  clearDraw() {
    if (!confirm('确定清空画布吗？')) return;
    this.saveDrawState();
    this.clearDrawCanvas();
  },

  loadDrawing(dataUrl) {
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    };
    img.src = dataUrl;
  },

  // ========== Color Palette ==========
  hexToRgb(hex) {
    const c = hex.replace('#','');
    return {
      r: parseInt(c.substr(0,2),16),
      g: parseInt(c.substr(2,2),16),
      b: parseInt(c.substr(4,2),16),
    };
  },

  getEffectiveDrawColor() {
    const rgb = this.hexToRgb(this.state.drawColor);
    return `rgba(${rgb.r},${rgb.g},${rgb.b},${this.state.drawOpacity})`;
  },

  renderColorPalette() {

    palette.innerHTML = this.colors.map(c => 
      `<div class="color-dot ${c === this.state.drawColor ? 'active' : ''}" style="background:${c}" onclick="App.setDrawColor('${c}')"></div>`

      ).join('');

    if (value) value.textContent = Math.round(this.state.drawOpacity * 100) + '%';

  setDrawOpacity(val) {

  getEffectivePatternColor() {

    return `rgba(${rgb.r},${rgb.g},${rgb.b},${this.state.patternDrawOpacity})`;
  },

  getEffectiveFullPageColor() {

  // ========== Background ==========
  applyBackground() {
    const bg = this.state.currentBg;
    const paperBg = document.getElementById('paperBg');
    const textLayer = document.getElementById('textLayer');

    if (!bg) {
      paperBg.style.cssText = '';
      paperBg.style.background = 'var(--surface)';
      textLayer.style.color = 'var(--text)';
      return;
    }

    if (bg.type === 'preset') {
      const preset = this.presets.find(p => p.id === bg.presetId);
      if (preset) {
        paperBg.style.cssText = '';
        if (preset.extraStyle) {
          paperBg.style.cssText = preset.extraStyle;
        }
        // Use CSS variable for blank paper so it follows theme
        if (bg.presetId === 'blank') {
          paperBg.style.background = 'var(--surface)';
          textLayer.style.color = 'var(--text)';
        } else {
          paperBg.style.background = preset.bg;
          textLayer.style.color = preset.textColor || 'var(--text)';
        }
      }
    } else if (bg.type === 'custom') {
      paperBg.style.cssText = '';
      if (bg.fullPageImage) {
        paperBg.style.background = `url("${bg.fullPageImage}")`;
        paperBg.style.backgroundSize = 'cover';
        paperBg.style.backgroundRepeat = 'no-repeat';
        paperBg.style.backgroundPosition = 'top center';
        textLayer.style.color = '#1E1B2E';
      } else {
        let bgStr = bg.color;
        if (bg.pattern) {
          const pattern = this.patterns.find(p => p.id === bg.pattern);
          if (pattern && pattern.svg) {
            const patternColor = bg.patternColor || '#CCCCCC';
            const fullSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">${pattern.svg.replace(/\{color\}/g, patternColor)}</svg>`;
            bgStr = `url("data:image/svg+xml,${encodeURIComponent(fullSvg)}")`;
          }
        } else if (bg.customPatternImage) {
          bgStr = `url("${bg.customPatternImage}")`;
        }
        paperBg.style.background = bgStr;
        paperBg.style.backgroundColor = bg.color;
        textLayer.style.color = this.isDarkColor(bg.color) ? '#E5E7EB' : '#1E1B2E';
      }
    }
  },

  isDarkColor(hex) {
    const c = hex.replace('#', '');
    const r = parseInt(c.substr(0, 2), 16);
    const g = parseInt(c.substr(2, 2), 16);
    const b = parseInt(c.substr(4, 2), 16);
    return (r * 0.299 + g * 0.587 + b * 0.114) < 128;
  },

  // ========== Pattern Drawing ==========
  initPatternCanvas() {
    const canvas = document.getElementById('patternDrawCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('patternDrawOverlay');
    const overlayCtx = overlay.getContext('2d');
    
    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const touch = e.touches ? e.touches[0] : e;
      return {
        x: (touch.clientX - rect.left) * scaleX,
        y: (touch.clientY - rect.top) * scaleY,
      };
    };

    const start = (e) => {
      e.preventDefault();
      this.state.patternDrawing = true;
      const pos = getPos(e);
      this.state.patternLastX = pos.x;
      this.state.patternLastY = pos.y;
      // Save state for undo
      this.savePatternDrawState();
      // Setup overlay for draw mode
      if (this.state.patternDrawMode === 'draw') {
        overlay.width = canvas.width;
        overlay.height = canvas.height;
        overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
        overlay.style.opacity = this.state.patternDrawOpacity;
      }
    };

    const move = (e) => {
      if (!this.state.patternDrawing) return;
      e.preventDefault();
      const pos = getPos(e);

      if (this.state.patternDrawMode === 'eraser') {
        // Eraser paints with background color to "restore" the base
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.lineWidth = this.state.patternEraserSizes[this.state.patternEraserIndex];
        ctx.strokeStyle = this.state.customBg.color || '#FFF8E7';
        ctx.beginPath();
        ctx.moveTo(this.state.patternLastX, this.state.patternLastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else {
        // Draw on overlay at full opacity — CSS handles the transparency
        overlayCtx.lineJoin = 'round';
        overlayCtx.lineCap = 'round';
        overlayCtx.lineWidth = this.state.patternDrawBrushSizes[this.state.patternDrawBrushIndex];
        overlayCtx.strokeStyle = this.state.patternDrawColor;
        overlayCtx.beginPath();
        overlayCtx.moveTo(this.state.patternLastX, this.state.patternLastY);
        overlayCtx.lineTo(pos.x, pos.y);
        overlayCtx.stroke();
      }
      this.state.patternLastX = pos.x;
      this.state.patternLastY = pos.y;
    };

    const end = () => {
      if (this.state.patternDrawing && this.state.patternDrawMode === 'draw') {
        // Composite overlay onto main canvas
        ctx.globalAlpha = this.state.patternDrawOpacity;
        ctx.drawImage(overlay, 0, 0);
        ctx.globalAlpha = 1.0;
        overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
        overlay.style.opacity = 0;
      }
      this.state.patternDrawing = false;
    };

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
  },

  openPatternDraw() {
    // Check if there's existing custom pattern content
    if (this.state.customBg.customPatternImage) {
      this._redrawChoiceType = 'pattern';
      document.getElementById('redrawChoiceDesc').textContent = '检测到你之前已经画过图案，你想怎么继续？';
      document.getElementById('redrawChoiceModal').classList.add('active');

  _openPatternDrawFresh() {

  savePatternDrawState() {

      const data = canvas.toDataURL();
      this.state.patternDrawHistory.push(data);
      if (this.state.patternDrawHistory.length > this.state.maxHistory) {
        this.state.patternDrawHistory.shift();
      }
    } catch {}
  },

  undoPatternDraw() {
    if (this.state.patternDrawHistory.length === 0) {
      this.toast('没有可撤回的操作');
      return;
    }
    const data = this.state.patternDrawHistory.pop();
    const canvas = document.getElementById('patternDrawCanvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ========== Full Page Drawing ==========
  initFullPageCanvas() {
    const canvas = document.getElementById('fullPageCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('fullPageOverlay');
    const overlayCtx = overlay.getContext('2d');
    ctx.fillStyle = this.state.customBg.color || '#FFF8E7';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const touch = e.touches ? e.touches[0] : e;
      return {
        x: (touch.clientX - rect.left) * scaleX,
        y: (touch.clientY - rect.top) * scaleY,
      };
    };

    const start = (e) => {
      e.preventDefault();
      this.state.fullPageDrawing = true;
      const pos = getPos(e);
      this.state.fullPageLastX = pos.x;
      this.state.fullPageLastY = pos.y;
      // Save state for undo
      this.saveFullPageDrawState();
      // Setup overlay for draw mode
      if (this.state.fullPageMode === 'draw') {
        overlay.width = canvas.width;
        overlay.height = canvas.height;
        overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
        overlay.style.opacity = this.state.fullPageDrawOpacity;
      }
    };

    const move = (e) => {
      if (!this.state.fullPageDrawing) return;
      e.preventDefault();
      const pos = getPos(e);

      if (this.state.fullPageMode === 'eraser') {
        // Eraser paints with background color — only removes strokes, keeps base color
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.lineWidth = this.state.fullPageEraserSizes[this.state.fullPageEraserIndex];
        ctx.strokeStyle = this.state.customBg.color || '#FFF8E7';
        ctx.beginPath();
        ctx.moveTo(this.state.fullPageLastX, this.state.fullPageLastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else {
        // Draw on overlay at full opacity — CSS handles transparency
        overlayCtx.lineJoin = 'round';
        overlayCtx.lineCap = 'round';
        overlayCtx.lineWidth = this.state.fullPageBrushSizes[this.state.fullPageBrushIndex];
        overlayCtx.strokeStyle = this.state.fullPageDrawColor;
        overlayCtx.beginPath();
        overlayCtx.moveTo(this.state.fullPageLastX, this.state.fullPageLastY);
        overlayCtx.lineTo(pos.x, pos.y);
        overlayCtx.stroke();
      }
      this.state.fullPageLastX = pos.x;
      this.state.fullPageLastY = pos.y;
    };

    const end = () => {
      if (this.state.fullPageDrawing && this.state.fullPageMode === 'draw') {
        // Composite overlay onto main canvas
        ctx.globalAlpha = this.state.fullPageDrawOpacity;
        ctx.drawImage(overlay, 0, 0);
        ctx.globalAlpha = 1.0;
        overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
        overlay.style.opacity = 0;
      }
      this.state.fullPageDrawing = false;
    };

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);

    this.renderFullPageColors();
  },

  renderFullPageColors() {
    const palette = document.getElementById('fullPageColorPalette');
    if (!palette) return;
    palette.innerHTML = this.colors.map(c =>
      `<div class="color-dot ${c === this.state.fullPageDrawColor ? 'active' : ''}" style="background:${c}" onclick="App.setFullPageColor('${c}')"></div>`
    ).join('');

  toggleFullPageEraser() {

    } else {

    }

  showFullPageBrushBtn() {

  cycleFullPageBrush() {

  },

  cycleFullPageEraser() {

    this.updateFullPageEraserDot();
  },

  updateFullPageBrushDot() {
    const dot = document.getElementById('fpBrushDot');
    if (!dot) return;

  updateFullPageEraserDot() {

    const displaySize = Math.min(size * 0.8, 20);
    dot.style.width = displaySize + 'px';
    dot.style.height = displaySize + 'px';
  },

  saveFullPageDrawState() {
    const canvas = document.getElementById('fullPageCanvas');
    try {
      const data = canvas.toDataURL();
      this.state.fullPageDrawHistory.push(data);
      if (this.state.fullPageDrawHistory.length > this.state.maxHistory) {
        this.state.fullPageDrawHistory.shift();
      }
    } catch {}
  },

  undoFullPageDraw() {
    if (this.state.fullPageDrawHistory.length === 0) {
      this.toast('没有可撤回的操作');
      return;
    }
    const data = this.state.fullPageDrawHistory.pop();
    const canvas = document.getElementById('fullPageCanvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
    };
    img.src = data;
  },

  fillFullPageCanvas() {
    const canvas = document.getElementById('fullPageCanvas');
    const ctx = canvas.getContext('2d');
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = this.state.fullPageDrawOpacity;
    ctx.fillStyle = this.state.fullPageDrawColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1.0;
    this.toast('已填充底色');

  // ========== Save Note ==========
  saveNote(silent = false) {
    const title = document.getElementById('noteTitle').value.trim();
    const text = document.getElementById('textLayer').innerHTML;
    const textTrimmed = text.trim();
    
    let drawingData = null;
    if (this.hasDrawing()) {
      const canvas = document.getElementById('drawCanvas');
      drawingData = canvas.toDataURL('image/png');
    }
    
    if (!title && !textTrimmed && !drawingData && !this.state.voiceDataUrl) {
      if (!silent) this.toast('内容为空，未保存');
      return;
    }

    const now = Date.now();
    const notes = this.getNotes();
    
    if (this.state.currentNote) {
      // Update existing
      const idx = notes.findIndex(n => n.id === this.state.currentNote.id);
      if (idx >= 0) {
        notes[idx].title = title;
        notes[idx].text = text;
        notes[idx].drawingData = drawingData;
        notes[idx].voiceData = this.state.voiceDataUrl || null;
        notes[idx].background = this.state.currentBg;
        notes[idx].updatedAt = now;
        this.state.currentNote = notes[idx];
      }
    } else {
      // Create new
      const newNote = {
        id: 'note_' + now + '_' + Math.random().toString(36).substr(2, 6),
        title: title || (textTrimmed ? textTrimmed.replace(/<[^>]*>/g, '').substring(0, 20) : '手绘画作'),
        text: text,
        drawingData: drawingData,
        voiceData: this.state.voiceDataUrl || null,
        background: this.state.currentBg,
        collection: null,
        createdAt: now,
        updatedAt: now,
      };
      notes.push(newNote);
      this.state.currentNote = newNote;
      this.saveNotes(notes);
      
      // Show collection modal for new notes
      if (!silent) {
        this.showCollectionModal(newNote.id);
        return;
      }
    }
    
    this.saveNotes(notes);
    if (!silent) this.toast('已保存 ✓');
  },

  // ========== Collection Modal ==========
  showCollectionModal(noteId) {
    const notes = this.getNotes();
    const note = notes.find(n => n.id === noteId);
    if (!note) return;
    
    const list = document.getElementById('modalCollectionList');
    list.innerHTML = this.collections.map(col => {
      const selected = note.collection === col.id;
      return `
        <div class="modal-collection-item ${selected ? 'selected' : ''}" onclick="App.assignCollection('${noteId}', '${col.id}')">
          <div class="icon" style="background:${col.color}15">${col.icon}</div>
          <div class="name" style="color:${col.color}">${col.name}</div>
          <div class="check">✓</div>
        </div>
      `;
    }).join('') + `
      <div class="modal-collection-item skip" onclick="App.skipCollection()">
        跳过，归入未分类
      </div>
    `;
    
    document.getElementById('collectionModal').classList.add('active');
  },

  assignCollection(noteId, colId) {
    const notes = this.getNotes();
    const idx = notes.findIndex(n => n.id === noteId);
    if (idx >= 0) {
      notes[idx].collection = colId;
      this.saveNotes(notes);
    }
    document.getElementById('collectionModal').classList.remove('active');
    const col = this.collections.find(c => c.id === colId);
    this.toast(`已归类到「${col.name}」`);
    
    setTimeout(() => {
      this.renderHome();
      this.showView('homeView');
    }, 300);
  },

  skipCollection() {
    // Assign to 未分类
    const notes = this.getNotes();
    const note = this.state.currentNote;
    if (note) {
      const idx = notes.findIndex(n => n.id === note.id);
      if (idx >= 0) {
        notes[idx].collection = 'uncategorized';
        this.saveNotes(notes);
      }
    }
    document.getElementById('collectionModal').classList.remove('active');
    this.toast('已归入「未分类」');
    setTimeout(() => {
      this.renderHome();
      this.showView('homeView');
    }, 300);
  },
